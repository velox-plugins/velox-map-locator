name: Core CI

on:
  push:
  pull_request:

jobs:
  node:
    name: JavaScript build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:js

  php:
    name: PHP tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test
