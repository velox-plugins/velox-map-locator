name: Apply 1.1 Lazy Map Runtime

on:
  push:
    branches:
      - release/1.1.0
    paths:
      - '.github/workflows/apply-v1-1-lazy-map-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.0
          fetch-depth: 0

      - name: Apply lazy map runtime changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Frontend asset manager: keep immediate mode normal, expose URLs only for interaction mode.
          p = Path('includes/frontend/class-assets.php')
          text = p.read_text()
          replace_target = "final class Assets {\n"
          if replace_target not in text:
              raise SystemExit('Assets class declaration not found')
          text = text.replace(
              replace_target,
              "final class Assets {\n\n\t/** Whether lazy map runtime URLs were already exposed for this request. */\n\tprivate static $lazy_runtime_configured = false;\n",
              1,
          )

          pattern = re.compile(
              r"\t/\*\*\n\t \* Enqueue one map engine only when a map-capable Locator renders\..*?\n\t/\*\* Whether the local Leaflet runtime is physically present\. \*/",
              re.S,
          )
          replacement = r'''\t/**
\t * Enqueue one map engine only when a map-capable Locator renders.
\t *
\t * Interaction Privacy Mode exposes local runtime URLs to the shared
\t * frontend controller but does not request map-specific assets until the
\t * visitor explicitly chooses to load the map.
\t *
\t * @param string $provider  Provider identifier.
\t * @param string $load_mode Resolved map load mode.
\t */
\tpublic static function enqueue_map( $provider, $load_mode = 'immediate' ) {
\t\tif ( ! wp_script_is( 'velomalo-map-leaflet', 'registered' ) && ! wp_script_is( 'velomalo-map-google', 'registered' ) ) {
\t\t\tself::register_assets();
\t\t}

\t\t$provider  = sanitize_key( (string) $provider );
\t\t$load_mode = sanitize_key( (string) $load_mode );

\t\tif ( 'interaction' === $load_mode ) {
\t\t\tself::configure_lazy_map_runtime();
\t\t\treturn;
\t\t}

\t\tif ( 'google' === $provider ) {
\t\t\tif ( wp_script_is( 'velomalo-map-google', 'registered' ) ) {
\t\t\t\twp_enqueue_script( 'velomalo-map-google' );
\t\t\t}
\t\t\treturn;
\t\t}

\t\tif ( ! in_array( $provider, array( 'osm', 'xyz' ), true ) ) {
\t\t\treturn;
\t\t}

\t\tif ( wp_style_is( 'velomalo-leaflet', 'registered' ) ) {
\t\t\twp_enqueue_style( 'velomalo-leaflet' );
\t\t}
\t\tif ( wp_script_is( 'velomalo-map-leaflet', 'registered' ) ) {
\t\t\twp_enqueue_script( 'velomalo-map-leaflet' );
\t\t}
\t}

\t/** Expose versioned local map-runtime URLs without downloading them. */
\tprivate static function configure_lazy_map_runtime() {
\t\tif ( self::$lazy_runtime_configured || ! wp_script_is( 'velomalo-frontend', 'registered' ) ) {
\t\t\treturn;
\t\t}

\t\t$assets = array(
\t\t\t'leafletJs'      => self::versioned_asset_url( 'assets/vendor/leaflet/leaflet.min.js', '1.9.4' ),
\t\t\t'leafletCss'     => self::versioned_asset_url( 'assets/vendor/leaflet/leaflet.min.css', '1.9.4' ),
\t\t\t'leafletAdapter' => self::versioned_asset_url( 'build/map-leaflet.js' ),
\t\t\t'googleAdapter'  => self::versioned_asset_url( 'build/map-google.js' ),
\t\t);

\t\twp_add_inline_script(
\t\t\t'velomalo-frontend',
\t\t\t'window.VelomaloMapRuntimeAssets = ' . wp_json_encode( $assets ) . ';',
\t\t\t'before'
\t\t);
\t\tself::$lazy_runtime_configured = true;
\t}

\t/** Return a cache-safe plugin asset URL for dynamic loading. */
\tprivate static function versioned_asset_url( $relative_path, $version = '' ) {
\t\t$relative_path = ltrim( (string) $relative_path, '/' );
\t\t$path          = VELOX_MAP_LOCATOR_PATH . $relative_path;
\t\t$url           = VELOX_MAP_LOCATOR_URL . $relative_path;
\t\t$version       = $version ? (string) $version : ( file_exists( $path ) ? (string) filemtime( $path ) : VELOX_MAP_LOCATOR_VERSION );
\t\treturn add_query_arg( 'ver', $version, $url );
\t}

\t/** Whether the local Leaflet runtime is physically present. */'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Could not replace enqueue_map block: {count}')
          p.write_text(text)

          # Renderer passes the resolved mode and exposes loading/failure strings.
          replace_once(
              'includes/frontend/class-renderer.php',
              "\t\t\t\tAssets::enqueue_map( $provider_id );\n",
              "\t\t\t\tAssets::enqueue_map( $provider_id, $privacy_mode );\n",
          )
          replace_once(
              'includes/frontend/class-renderer.php',
              "\t\t\t'locating'                => __( 'Locating…', 'velox-map-locator' ),\n",
              "\t\t\t'locating'                => __( 'Locating…', 'velox-map-locator' ),\n\t\t\t'loading_map'             => __( 'Loading map…', 'velox-map-locator' ),\n\t\t\t'retry_map'               => __( 'Try again', 'velox-map-locator' ),\n\t\t\t'map_load_failed'         => __( 'The map resources could not be loaded. Please try again.', 'velox-map-locator' ),\n",
          )

          # Shared frontend loader. It is part of the already-required locator frontend,
          # so gated maps add no map-runtime request before the visitor clicks.
          p = Path('src/frontend/index.js')
          text = p.read_text()
          anchor = "\tclass LocatorController {\n"
          if anchor not in text:
              raise SystemExit('LocatorController anchor not found')
          lazy_code = r'''\tconst mapRuntimePromises = new Map();

\tfunction canonicalUrl( value ) {
\t\ttry { return new URL( String( value || '' ), document.baseURI ).href; } catch ( error ) { return String( value || '' ); }
\t}

\tfunction existingAssetNode( selector, url ) {
\t\tconst expected = canonicalUrl( url );
\t\treturn Array.from( document.querySelectorAll( selector ) ).find( ( node ) => canonicalUrl( node.src || node.href ) === expected ) || null;
\t}

\tfunction loadRuntimeStyle( url, key ) {
\t\tif ( ! url ) return Promise.reject( new Error( 'Map stylesheet URL is unavailable.' ) );
\t\tconst promiseKey = `style:${ key }`;
\t\tif ( mapRuntimePromises.has( promiseKey ) ) return mapRuntimePromises.get( promiseKey );
\t\tif ( existingAssetNode( 'link[rel="stylesheet"][href]', url ) ) return Promise.resolve();
\t\tconst promise = new Promise( ( resolve, reject ) => {
\t\t\tconst link = document.createElement( 'link' );
\t\t\tlink.rel = 'stylesheet';
\t\t\tlink.href = url;
\t\t\tlink.dataset.vmlRuntimeStyle = key;
\t\t\tlink.addEventListener( 'load', resolve, { once: true } );
\t\t\tlink.addEventListener( 'error', () => { link.remove(); reject( new Error( 'Map stylesheet could not load.' ) ); }, { once: true } );
\t\t\tdocument.head.appendChild( link );
\t\t} ).catch( ( error ) => { mapRuntimePromises.delete( promiseKey ); throw error; } );
\t\tmapRuntimePromises.set( promiseKey, promise );
\t\treturn promise;
\t}

\tfunction loadRuntimeScript( url, key, ready ) {
\t\tif ( typeof ready === 'function' && ready() ) return Promise.resolve();
\t\tif ( ! url ) return Promise.reject( new Error( 'Map script URL is unavailable.' ) );
\t\tconst promiseKey = `script:${ key }`;
\t\tif ( mapRuntimePromises.has( promiseKey ) ) return mapRuntimePromises.get( promiseKey );
\t\tconst existing = existingAssetNode( 'script[src]', url );
\t\tconst promise = new Promise( ( resolve, reject ) => {
\t\t\tconst finish = () => {
\t\t\t\tif ( ! ready || ready() ) resolve();
\t\t\t\telse reject( new Error( 'Map script loaded but did not initialize.' ) );
\t\t\t};
\t\t\tif ( existing ) {
\t\t\t\tif ( ! ready || ready() ) { resolve(); return; }
\t\t\t\texisting.addEventListener( 'load', finish, { once: true } );
\t\t\t\texisting.addEventListener( 'error', () => reject( new Error( 'Map script could not load.' ) ), { once: true } );
\t\t\t\treturn;
\t\t\t}
\t\t\tconst script = document.createElement( 'script' );
\t\t\tscript.src = url;
\t\t\tscript.async = true;
\t\t\tscript.dataset.vmlRuntimeScript = key;
\t\t\tconst nonceSource = document.querySelector( 'script[nonce]' );
\t\t\tif ( nonceSource && nonceSource.nonce ) script.nonce = nonceSource.nonce;
\t\t\tscript.addEventListener( 'load', finish, { once: true } );
\t\t\tscript.addEventListener( 'error', () => { script.remove(); reject( new Error( 'Map script could not load.' ) ); }, { once: true } );
\t\t\tdocument.head.appendChild( script );
\t\t} ).catch( ( error ) => { mapRuntimePromises.delete( promiseKey ); throw error; } );
\t\tmapRuntimePromises.set( promiseKey, promise );
\t\treturn promise;
\t}

\tfunction lazyMapBody( root ) {
\t\tconst gate = root.querySelector( '[data-vml-map-privacy]' );
\t\tif ( ! gate ) return null;
\t\treturn Array.from( gate.children ).find( ( child ) => child.tagName === 'SPAN' && ! child.classList.contains( 'vml-map-state__icon' ) && ! child.classList.contains( 'vml-map-state__provider' ) ) || null;
\t}

\tfunction setLazyMapFailure( root, button, payload ) {
\t\tconst strings = payload.strings || {};
\t\tbutton.disabled = false;
\t\tbutton.classList.remove( 'is-busy' );
\t\tbutton.setAttribute( 'aria-busy', 'false' );
\t\tbutton.textContent = strings.retry_map || 'Try again';
\t\tconst body = lazyMapBody( root );
\t\tif ( body ) body.textContent = strings.map_load_failed || 'The map resources could not be loaded. Please try again.';
\t\tconst runtimeError = root.querySelector( '[data-vml-map-runtime-error]' );
\t\tif ( runtimeError ) runtimeError.hidden = false;
\t}

\tfunction loadLazyMapRuntime( root, button, payload ) {
\t\tconst assets = window.VelomaloMapRuntimeAssets || {};
\t\tconst engine = payload.map_provider && payload.map_provider.engine;
\t\tconst strings = payload.strings || {};
\t\tif ( root.dataset.vmlMapRuntimeLoading === 'true' ) return;
\t\troot.dataset.vmlMapRuntimeLoading = 'true';
\t\tbutton.disabled = true;
\t\tbutton.classList.add( 'is-busy' );
\t\tbutton.setAttribute( 'aria-busy', 'true' );
\t\tbutton.textContent = strings.loading_map || 'Loading map…';
\t\tconst runtimeError = root.querySelector( '[data-vml-map-runtime-error]' );
\t\tif ( runtimeError ) runtimeError.hidden = true;

\t\tlet runtime;
\t\tif ( engine === 'leaflet' ) {
\t\t\truntime = Promise.all( [
\t\t\t\tloadRuntimeStyle( assets.leafletCss, 'leaflet' ),
\t\t\t\tloadRuntimeScript( assets.leafletJs, 'leaflet', () => Boolean( window.L ) ),
\t\t\t] ).then( () => loadRuntimeScript( assets.leafletAdapter, 'leaflet-adapter', () => Boolean( window.VelomaloMapLeaflet ) ) )
\t\t\t\t.then( () => {
\t\t\t\t\twindow.VelomaloMapLeaflet.initializeRoot( root );
\t\t\t\t\tif ( typeof root.vmlLoadMap !== 'function' ) throw new Error( 'Leaflet map adapter did not expose a loader.' );
\t\t\t\t\treturn root.vmlLoadMap();
\t\t\t\t} );
\t\t} else if ( engine === 'google' ) {
\t\t\truntime = loadRuntimeScript( assets.googleAdapter, 'google-adapter', () => Boolean( window.VelomaloMapGoogle ) )
\t\t\t\t.then( () => {
\t\t\t\t\twindow.VelomaloMapGoogle.initializeRoot( root );
\t\t\t\t\tif ( typeof root.vmlLoadMap !== 'function' ) throw new Error( 'Google map adapter did not expose a loader.' );
\t\t\t\t\treturn root.vmlLoadMap();
\t\t\t\t} );
\t\t} else {
\t\t\truntime = Promise.reject( new Error( 'Unsupported lazy map engine.' ) );
\t\t}

\t\tPromise.resolve( runtime ).then( ( loaded ) => {
\t\t\tif ( loaded === false ) throw new Error( 'Map runtime could not initialize.' );
\t\t} ).catch( () => {
\t\t\tsetLazyMapFailure( root, button, payload );
\t\t} ).finally( () => {
\t\t\troot.dataset.vmlMapRuntimeLoading = 'false';
\t\t} );
\t}

\tfunction bindLazyMapRuntime( root ) {
\t\tconst payload = safeJsonParse( root.querySelector( '.vml-locator__data' ) );
\t\tif ( ! payload || payload.map_load_mode !== 'interaction' || ! payload.map_provider ) return;
\t\tconst engine = payload.map_provider.engine;
\t\tif ( engine === 'leaflet' && window.VelomaloMapLeaflet ) return;
\t\tif ( engine === 'google' && window.VelomaloMapGoogle ) return;
\t\tif ( ! window.VelomaloMapRuntimeAssets ) return;
\t\tconst button = root.querySelector( '[data-vml-load-map]' );
\t\tif ( ! button || button.dataset.vmlLazyRuntimeBound === 'true' ) return;
\t\tbutton.dataset.vmlLazyRuntimeBound = 'true';
\t\troot.dataset.vmlLazyMapRuntime = 'true';
\t\tbutton.addEventListener( 'click', () => loadLazyMapRuntime( root, button, payload ) );
\t}

'''
          text = text.replace(anchor, lazy_code + anchor, 1)
          init_old = "\t\troot.vmlController = new LocatorController( root );\n"
          if init_old not in text:
              raise SystemExit('initializeRoot controller line not found')
          text = text.replace(init_old, init_old + "\t\tbindLazyMapRuntime( root );\n", 1)
          p.write_text(text)

          # Leaflet adapter exposes an explicit loader and keeps the privacy gate visible
          # until the local runtime actually initializes.
          p = Path('src/frontend/map-leaflet.js')
          text = p.read_text()
          text = text.replace(
              "\t\tinit() {\n\t\t\tif ( this.ready || ! this.canvas || ! window.L || ! this.provider.tile_url ) return;\n",
              "\t\tinit() {\n\t\t\tif ( this.ready ) return true;\n\t\t\tif ( ! this.canvas || ! window.L || ! this.provider.tile_url ) return false;\n",
              1,
          )
          text = text.replace(
              "\t\t\t\tconst selected = this.root.querySelector( '.vml-location-card.is-selected' );\n\t\t\t\tif ( selected ) this.selectMarker( Number( selected.dataset.vmlLocationId || 0 ), false );\n\t\t\t} catch ( error ) {\n\t\t\t\tthis.showFailure();\n\t\t\t}\n\t\t}\n",
              "\t\t\t\tconst selected = this.root.querySelector( '.vml-location-card.is-selected' );\n\t\t\t\tif ( selected ) this.selectMarker( Number( selected.dataset.vmlLocationId || 0 ), false );\n\t\t\t\treturn true;\n\t\t\t} catch ( error ) {\n\t\t\t\tthis.showFailure();\n\t\t\t\treturn false;\n\t\t\t}\n\t\t}\n",
              1,
          )
          old_init = r'''\tfunction initializeRoot( root ) {
\t\tif ( root.dataset.vmlLeafletInitialized === 'true' ) return;
\t\tconst payload = safeJsonParse( root.querySelector( '.vml-locator__data' ) );
\t\tif ( ! payload || ! payload.map_provider || payload.map_provider.engine !== 'leaflet' ) return;
\t\tconst canvas = root.querySelector( '[data-vml-map-canvas]' );
\t\tif ( ! canvas ) return;
\t\troot.dataset.vmlLeafletInitialized = 'true';
\t\tconst locatorMap = new LeafletLocatorMap( root, payload );
\t\troot.vmlMap = locatorMap;
\t\tconst load = () => {
\t\t\tconst privacy = root.querySelector( '[data-vml-map-privacy]' );
\t\t\tif ( privacy ) privacy.hidden = true;
\t\t\tcanvas.hidden = false;
\t\t\tlocatorMap.init();
\t\t};
\t\tconst loadButton = root.querySelector( '[data-vml-load-map]' );
\t\tif ( payload.map_load_mode === 'interaction' && loadButton ) {
\t\t\tloadButton.addEventListener( 'click', load, { once: true } );
\t\t\treturn;
\t\t}
'''
          new_init = r'''\tfunction initializeRoot( root ) {
\t\tif ( root.dataset.vmlLeafletInitialized === 'true' ) return;
\t\tconst payload = safeJsonParse( root.querySelector( '.vml-locator__data' ) );
\t\tif ( ! payload || ! payload.map_provider || payload.map_provider.engine !== 'leaflet' ) return;
\t\tconst canvas = root.querySelector( '[data-vml-map-canvas]' );
\t\tif ( ! canvas ) return;
\t\troot.dataset.vmlLeafletInitialized = 'true';
\t\tconst locatorMap = new LeafletLocatorMap( root, payload );
\t\troot.vmlMap = locatorMap;
\t\tconst loadButton = root.querySelector( '[data-vml-load-map]' );
\t\tconst load = () => {
\t\t\tconst privacy = root.querySelector( '[data-vml-map-privacy]' );
\t\t\tconst strings = payload.strings || {};
\t\t\tif ( loadButton ) {
\t\t\t\tloadButton.disabled = true;
\t\t\t\tloadButton.classList.add( 'is-busy' );
\t\t\t\tloadButton.setAttribute( 'aria-busy', 'true' );
\t\t\t\tloadButton.textContent = strings.loading_map || 'Loading map…';
\t\t\t}
\t\t\tcanvas.hidden = false;
\t\t\tconst loaded = locatorMap.init();
\t\t\tif ( loaded ) {
\t\t\t\tif ( privacy ) privacy.hidden = true;
\t\t\t\treturn true;
\t\t\t}
\t\t\tif ( privacy ) privacy.hidden = false;
\t\t\tif ( loadButton ) {
\t\t\t\tloadButton.disabled = false;
\t\t\t\tloadButton.classList.remove( 'is-busy' );
\t\t\t\tloadButton.setAttribute( 'aria-busy', 'false' );
\t\t\t\tloadButton.textContent = strings.retry_map || 'Try again';
\t\t\t}
\t\t\treturn false;
\t\t};
\t\troot.vmlLoadMap = load;
\t\tif ( payload.map_load_mode === 'interaction' && loadButton ) {
\t\t\tif ( root.dataset.vmlLazyMapRuntime === 'true' ) return;
\t\t\tloadButton.addEventListener( 'click', load );
\t\t\treturn;
\t\t}
'''
          if old_init not in text:
              raise SystemExit('Leaflet initializeRoot block not found')
          text = text.replace(old_init, new_init, 1)
          p.write_text(text)

          # Google adapter follows the same interaction-mode contract, but waits for
          # the async Google runtime before dismissing the privacy gate.
          p = Path('src/frontend/map-google.js')
          text = p.read_text()
          text = text.replace(
              "\t\tasync init() {\n\t\t\tif ( this.ready || this.initializing || ! this.canvas || ! this.provider.api_key || ! this.provider.map_id ) return;\n",
              "\t\tasync init() {\n\t\t\tif ( this.ready ) return true;\n\t\t\tif ( this.initializing || ! this.canvas || ! this.provider.api_key || ! this.provider.map_id ) return false;\n",
              1,
          )
          text = text.replace(
              "\t\t\t\tconst selected = this.root.querySelector( '.vml-location-card.is-selected' );\n\t\t\t\tif ( selected ) this.selectMarker( Number( selected.dataset.vmlLocationId || 0 ), false );\n\t\t\t} catch ( error ) {\n\t\t\t\tthis.showFailure();\n\t\t\t} finally {\n\t\t\t\tthis.initializing = false;\n\t\t\t}\n\t\t}\n",
              "\t\t\t\tconst selected = this.root.querySelector( '.vml-location-card.is-selected' );\n\t\t\t\tif ( selected ) this.selectMarker( Number( selected.dataset.vmlLocationId || 0 ), false );\n\t\t\t\treturn true;\n\t\t\t} catch ( error ) {\n\t\t\t\tthis.showFailure();\n\t\t\t\treturn false;\n\t\t\t} finally {\n\t\t\t\tthis.initializing = false;\n\t\t\t}\n\t\t}\n",
              1,
          )
          old_init = r'''\tfunction initializeRoot( root ) {
\t\tif ( root.dataset.vmlGoogleInitialized === 'true' ) return;
\t\tconst payload = safeJsonParse( root.querySelector( '.vml-locator__data' ) );
\t\tif ( ! payload || ! payload.map_provider || payload.map_provider.engine !== 'google' ) return;
\t\tconst canvas = root.querySelector( '[data-vml-map-canvas]' );
\t\tif ( ! canvas ) return;
\t\troot.dataset.vmlGoogleInitialized = 'true';
\t\tconst locatorMap = new GoogleLocatorMap( root, payload );
\t\troot.vmlMap = locatorMap;
\t\tconst load = () => {
\t\t\tconst privacy = root.querySelector( '[data-vml-map-privacy]' );
\t\t\tif ( privacy ) privacy.hidden = true;
\t\t\tcanvas.hidden = false;
\t\t\tlocatorMap.init();
\t\t};
\t\tconst loadButton = root.querySelector( '[data-vml-load-map]' );
\t\tif ( payload.map_load_mode === 'interaction' && loadButton ) {
\t\t\tloadButton.addEventListener( 'click', load, { once: true } );
\t\t\treturn;
\t\t}
'''
          new_init = r'''\tfunction initializeRoot( root ) {
\t\tif ( root.dataset.vmlGoogleInitialized === 'true' ) return;
\t\tconst payload = safeJsonParse( root.querySelector( '.vml-locator__data' ) );
\t\tif ( ! payload || ! payload.map_provider || payload.map_provider.engine !== 'google' ) return;
\t\tconst canvas = root.querySelector( '[data-vml-map-canvas]' );
\t\tif ( ! canvas ) return;
\t\troot.dataset.vmlGoogleInitialized = 'true';
\t\tconst locatorMap = new GoogleLocatorMap( root, payload );
\t\troot.vmlMap = locatorMap;
\t\tconst loadButton = root.querySelector( '[data-vml-load-map]' );
\t\tconst load = async () => {
\t\t\tconst privacy = root.querySelector( '[data-vml-map-privacy]' );
\t\t\tconst strings = payload.strings || {};
\t\t\tif ( loadButton ) {
\t\t\t\tloadButton.disabled = true;
\t\t\t\tloadButton.classList.add( 'is-busy' );
\t\t\t\tloadButton.setAttribute( 'aria-busy', 'true' );
\t\t\t\tloadButton.textContent = strings.loading_map || 'Loading map…';
\t\t\t}
\t\t\tcanvas.hidden = false;
\t\t\tconst loaded = await locatorMap.init();
\t\t\tif ( loaded ) {
\t\t\t\tif ( privacy ) privacy.hidden = true;
\t\t\t\treturn true;
\t\t\t}
\t\t\tif ( privacy ) privacy.hidden = false;
\t\t\tif ( loadButton ) {
\t\t\t\tloadButton.disabled = false;
\t\t\t\tloadButton.classList.remove( 'is-busy' );
\t\t\t\tloadButton.setAttribute( 'aria-busy', 'false' );
\t\t\t\tloadButton.textContent = strings.retry_map || 'Try again';
\t\t\t}
\t\t\treturn false;
\t\t};
\t\troot.vmlLoadMap = load;
\t\tif ( payload.map_load_mode === 'interaction' && loadButton ) {
\t\t\tif ( root.dataset.vmlLazyMapRuntime === 'true' ) return;
\t\t\tloadButton.addEventListener( 'click', load );
\t\t\treturn;
\t\t}
'''
          if old_init not in text:
              raise SystemExit('Google initializeRoot block not found')
          text = text.replace(old_init, new_init, 1)
          p.write_text(text)

          # Production/source parity.
          source = Path('src/frontend/index.js').read_text()
          if not source.startswith("import '../styles/frontend.scss';\n"):
              raise SystemExit('Unexpected frontend source header')
          Path('build/frontend.js').write_text(source.split('\n', 1)[1])
          Path('build/map-leaflet.js').write_text(Path('src/frontend/map-leaflet.js').read_text())
          Path('build/map-google.js').write_text(Path('src/frontend/map-google.js').read_text())

          # CI should verify the base frontend build too.
          ci = Path('.github/workflows/plugin-ci.yml')
          ci_text = ci.read_text()
          parity = "          tail -n +2 src/frontend/index.js | cmp - build/frontend.js\n"
          if parity not in ci_text:
              anchor = "          cmp src/frontend/polish-1-1-stability.js build/frontend-1-1-stability.js\n"
              if anchor not in ci_text:
                  raise SystemExit('CI parity anchor missing')
              ci_text = ci_text.replace(anchor, anchor + parity, 1)
              ci.write_text(ci_text)
          PY

          php -l includes/frontend/class-assets.php
          php -l includes/frontend/class-renderer.php
          node --check src/frontend/index.js
          node --check src/frontend/map-leaflet.js
          node --check src/frontend/map-google.js
          tail -n +2 src/frontend/index.js | cmp - build/frontend.js
          cmp src/frontend/map-leaflet.js build/map-leaflet.js
          cmp src/frontend/map-google.js build/map-google.js

      - name: Commit lazy runtime changes
        shell: bash
        run: |
          git config user.name 'Amar Saleem'
          git config user.email 'amarsaleem.sync@gmail.com'
          git add includes/frontend/class-assets.php includes/frontend/class-renderer.php src/frontend/index.js src/frontend/map-leaflet.js src/frontend/map-google.js build/frontend.js build/map-leaflet.js build/map-google.js .github/workflows/plugin-ci.yml
          git commit -m 'Defer map runtimes in interaction privacy mode'
          git push origin HEAD:release/1.1.0
