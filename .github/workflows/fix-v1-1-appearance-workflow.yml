name: Fix 1.1 Appearance Refinement Workflow

on:
  push:
    branches:
      - release/1.1.0
    paths:
      - '.github/workflows/fix-v1-1-appearance-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.0
          fetch-depth: 0
      - name: Correct Builder patch block
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/apply-v1-1-appearance-legend.yml')
          text = p.read_text()
          replacement = r'''          builder_old = """\t\t\t\t\th( 'div', { className: 'vml-field-grid two' },\n\t\t\t\t\t\th( ColorField, { label: __( 'Accent Colour', 'velox-map-locator' ), value: appearance.accent || '#2563eb', onChange: ( value ) => updateConfig( 'appearance.accent', value ) } ),\n\t\t\t\t\t\th( Field, { label: __( 'Card Padding', 'velox-map-locator' ), hint: __( '0–48 px. Leave blank to use the current theme default spacing.', 'velox-map-locator' ) }, h( 'input', { type: 'number', min: 0, max: 48, value: appearance.card_padding ?? '', placeholder: __( 'Theme default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.card_padding', event.target.value === '' ? null : Number( event.target.value ) ) } ) )\n\t\t\t\t\t)\n"""
          builder_new = """\t\t\t\t\th( 'div', { className: 'vml-field-grid two' },\n\t\t\t\t\t\th( ColorField, { label: __( 'Accent Colour', 'velox-map-locator' ), value: appearance.accent || '#2563eb', onChange: ( value ) => updateConfig( 'appearance.accent', value ) } ),\n\t\t\t\t\t\th( Field, { label: __( 'Card Padding', 'velox-map-locator' ), hint: __( '0–48 px. Leave blank to use the current theme default spacing.', 'velox-map-locator' ) }, h( 'input', { type: 'number', min: 0, max: 48, value: appearance.card_padding ?? '', placeholder: __( 'Theme default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.card_padding', event.target.value === '' ? null : Number( event.target.value ) ) } ) )\n\t\t\t\t\t),\n\t\t\t\t\th( 'div', { className: 'vml-builder-subhead' }, h( 'strong', null, __( 'Card typography', 'velox-map-locator' ) ), h( 'span', null, __( 'Leave fields blank to keep the current Velox defaults.', 'velox-map-locator' ) ) ),\n\t\t\t\t\th( 'div', { className: 'vml-field-grid two' },\n\t\t\t\t\t\th( Field, { label: __( 'Card Title Size', 'velox-map-locator' ), hint: '10–30 px' }, h( 'input', { type: 'number', min: 10, max: 30, value: appearance.card_title_size ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.card_title_size', event.target.value === '' ? null : Number( event.target.value ) ) } ) ),\n\t\t\t\t\t\th( Field, { label: __( 'Card Title Weight', 'velox-map-locator' ) }, h( 'input', { type: 'number', min: 300, max: 800, step: 50, value: appearance.card_title_weight ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.card_title_weight', event.target.value === '' ? null : Number( event.target.value ) ) } ) ),\n\t\t\t\t\t\th( Field, { label: __( 'Card Text Size', 'velox-map-locator' ), hint: '10–30 px' }, h( 'input', { type: 'number', min: 10, max: 30, value: appearance.card_text_size ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.card_text_size', event.target.value === '' ? null : Number( event.target.value ) ) } ) ),\n\t\t\t\t\t\th( Field, { label: __( 'Card Text Weight', 'velox-map-locator' ) }, h( 'input', { type: 'number', min: 300, max: 800, step: 50, value: appearance.card_text_weight ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.card_text_weight', event.target.value === '' ? null : Number( event.target.value ) ) } ) )\n\t\t\t\t\t),\n\t\t\t\t\th( 'div', { className: 'vml-builder-subhead' }, h( 'strong', null, __( 'Map popup typography', 'velox-map-locator' ) ), h( 'span', null, __( 'Fine-tune popup text without changing the site theme.', 'velox-map-locator' ) ) ),\n\t\t\t\t\th( 'div', { className: 'vml-field-grid two' },\n\t\t\t\t\t\th( Field, { label: __( 'Popup Title Size', 'velox-map-locator' ), hint: '10–30 px' }, h( 'input', { type: 'number', min: 10, max: 30, value: appearance.popup_title_size ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.popup_title_size', event.target.value === '' ? null : Number( event.target.value ) ) } ) ),\n\t\t\t\t\t\th( Field, { label: __( 'Popup Title Weight', 'velox-map-locator' ) }, h( 'input', { type: 'number', min: 300, max: 800, step: 50, value: appearance.popup_title_weight ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.popup_title_weight', event.target.value === '' ? null : Number( event.target.value ) ) } ) ),\n\t\t\t\t\t\th( Field, { label: __( 'Popup Text Size', 'velox-map-locator' ), hint: '10–30 px' }, h( 'input', { type: 'number', min: 10, max: 30, value: appearance.popup_text_size ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.popup_text_size', event.target.value === '' ? null : Number( event.target.value ) ) } ) ),\n\t\t\t\t\t\th( Field, { label: __( 'Popup Text Weight', 'velox-map-locator' ) }, h( 'input', { type: 'number', min: 300, max: 800, step: 50, value: appearance.popup_text_weight ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.popup_text_weight', event.target.value === '' ? null : Number( event.target.value ) ) } ) )\n\t\t\t\t\t)\n"""
          replace_once('src/admin/index.js', builder_old, builder_new)'''

          pattern = re.compile(r"          builder_old = .*?          replace_once\('src/admin/index\.js', builder_old, builder_new\)", re.S)
          next_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Builder patch block, found {count}')
          p.write_text(next_text)
          PY
          git config user.name 'Amar Saleem'
          git config user.email 'amarsaleem.sync@gmail.com'
          git add .github/workflows/apply-v1-1-appearance-legend.yml
          git commit -m 'Fix appearance refinement patch context'
          git push origin HEAD:release/1.1.0
