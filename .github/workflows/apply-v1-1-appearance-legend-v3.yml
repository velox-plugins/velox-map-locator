name: Apply 1.1 Semantic Legend and Typography

on:
  push:
    branches:
      - release/1.1.0
    paths:
      - '.github/workflows/apply-v1-1-appearance-legend-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.0
          fetch-depth: 0

      - name: Apply plugin changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Global optional appearance defaults. Null means preserve current Velox presentation.
          replace_once(
              'includes/content/class-settings.php',
              "\t\t\t\t'card_padding' => null,\n",
              "\t\t\t\t'card_padding'       => null,\n\t\t\t\t'card_title_size'    => null,\n\t\t\t\t'card_title_weight'  => null,\n\t\t\t\t'card_text_size'     => null,\n\t\t\t\t'card_text_weight'   => null,\n\t\t\t\t'popup_title_size'   => null,\n\t\t\t\t'popup_title_weight' => null,\n\t\t\t\t'popup_text_size'    => null,\n\t\t\t\t'popup_text_weight'  => null,\n"
          )
          replace_once(
              'includes/content/class-settings.php',
              "\t\tif ( array_key_exists( 'card_padding', $appearance ) && null !== $appearance['card_padding'] && '' !== $appearance['card_padding'] ) {\n\t\t\t$output['appearance']['card_padding'] = max( 0, min( 48, absint( $appearance['card_padding'] ) ) );\n\t\t} else {\n\t\t\t$output['appearance']['card_padding'] = $defaults['appearance']['card_padding'];\n\t\t}\n\n",
              "\t\tif ( array_key_exists( 'card_padding', $appearance ) && null !== $appearance['card_padding'] && '' !== $appearance['card_padding'] ) {\n\t\t\t$output['appearance']['card_padding'] = max( 0, min( 48, absint( $appearance['card_padding'] ) ) );\n\t\t} else {\n\t\t\t$output['appearance']['card_padding'] = $defaults['appearance']['card_padding'];\n\t\t}\n\t\tforeach ( array( 'card_title_size', 'card_text_size', 'popup_title_size', 'popup_text_size' ) as $size_key ) {\n\t\t\t$output['appearance'][ $size_key ] = array_key_exists( $size_key, $appearance ) && null !== $appearance[ $size_key ] && '' !== $appearance[ $size_key ]\n\t\t\t\t? max( 10, min( 30, absint( $appearance[ $size_key ] ) ) )\n\t\t\t\t: $defaults['appearance'][ $size_key ];\n\t\t}\n\t\tforeach ( array( 'card_title_weight', 'card_text_weight', 'popup_title_weight', 'popup_text_weight' ) as $weight_key ) {\n\t\t\t$output['appearance'][ $weight_key ] = array_key_exists( $weight_key, $appearance ) && null !== $appearance[ $weight_key ] && '' !== $appearance[ $weight_key ]\n\t\t\t\t? max( 300, min( 800, absint( $appearance[ $weight_key ] ) ) )\n\t\t\t\t: $defaults['appearance'][ $weight_key ];\n\t\t}\n\n"
          )

          # Locator appearance schema and sanitization.
          replace_once(
              'includes/services/class-locator-validator.php',
              "\t\t\t\t'card_padding' => array_key_exists( 'card_padding', $appearance_defaults ) && null !== $appearance_defaults['card_padding'] ? (int) $appearance_defaults['card_padding'] : null,\n",
              "\t\t\t\t'card_padding'       => array_key_exists( 'card_padding', $appearance_defaults ) && null !== $appearance_defaults['card_padding'] ? (int) $appearance_defaults['card_padding'] : null,\n\t\t\t\t'card_title_size'    => array_key_exists( 'card_title_size', $appearance_defaults ) && null !== $appearance_defaults['card_title_size'] ? (int) $appearance_defaults['card_title_size'] : null,\n\t\t\t\t'card_title_weight'  => array_key_exists( 'card_title_weight', $appearance_defaults ) && null !== $appearance_defaults['card_title_weight'] ? (int) $appearance_defaults['card_title_weight'] : null,\n\t\t\t\t'card_text_size'     => array_key_exists( 'card_text_size', $appearance_defaults ) && null !== $appearance_defaults['card_text_size'] ? (int) $appearance_defaults['card_text_size'] : null,\n\t\t\t\t'card_text_weight'   => array_key_exists( 'card_text_weight', $appearance_defaults ) && null !== $appearance_defaults['card_text_weight'] ? (int) $appearance_defaults['card_text_weight'] : null,\n\t\t\t\t'popup_title_size'   => array_key_exists( 'popup_title_size', $appearance_defaults ) && null !== $appearance_defaults['popup_title_size'] ? (int) $appearance_defaults['popup_title_size'] : null,\n\t\t\t\t'popup_title_weight' => array_key_exists( 'popup_title_weight', $appearance_defaults ) && null !== $appearance_defaults['popup_title_weight'] ? (int) $appearance_defaults['popup_title_weight'] : null,\n\t\t\t\t'popup_text_size'    => array_key_exists( 'popup_text_size', $appearance_defaults ) && null !== $appearance_defaults['popup_text_size'] ? (int) $appearance_defaults['popup_text_size'] : null,\n\t\t\t\t'popup_text_weight'  => array_key_exists( 'popup_text_weight', $appearance_defaults ) && null !== $appearance_defaults['popup_text_weight'] ? (int) $appearance_defaults['popup_text_weight'] : null,\n"
          )
          replace_once(
              'includes/services/class-locator-validator.php',
              "\t\t\tif ( array_key_exists( 'card_padding', $appearance ) ) {\n\t\t\t\tif ( null === $appearance['card_padding'] || '' === $appearance['card_padding'] ) {\n\t\t\t\t\t$config['appearance']['card_padding'] = null;\n\t\t\t\t} else {\n\t\t\t\t\t$config['appearance']['card_padding'] = max( 0, min( 48, absint( $appearance['card_padding'] ) ) );\n\t\t\t\t}\n\t\t\t}\n",
              "\t\t\tif ( array_key_exists( 'card_padding', $appearance ) ) {\n\t\t\t\tif ( null === $appearance['card_padding'] || '' === $appearance['card_padding'] ) {\n\t\t\t\t\t$config['appearance']['card_padding'] = null;\n\t\t\t\t} else {\n\t\t\t\t\t$config['appearance']['card_padding'] = max( 0, min( 48, absint( $appearance['card_padding'] ) ) );\n\t\t\t\t}\n\t\t\t}\n\t\t\tforeach ( array( 'card_title_size', 'card_text_size', 'popup_title_size', 'popup_text_size' ) as $size_key ) {\n\t\t\t\tif ( array_key_exists( $size_key, $appearance ) ) {\n\t\t\t\t\t$config['appearance'][ $size_key ] = null === $appearance[ $size_key ] || '' === $appearance[ $size_key ] ? null : max( 10, min( 30, absint( $appearance[ $size_key ] ) ) );\n\t\t\t\t}\n\t\t\t}\n\t\t\tforeach ( array( 'card_title_weight', 'card_text_weight', 'popup_title_weight', 'popup_text_weight' ) as $weight_key ) {\n\t\t\t\tif ( array_key_exists( $weight_key, $appearance ) ) {\n\t\t\t\t\t$config['appearance'][ $weight_key ] = null === $appearance[ $weight_key ] || '' === $appearance[ $weight_key ] ? null : max( 300, min( 800, absint( $appearance[ $weight_key ] ) ) );\n\t\t\t\t}\n\t\t\t}\n"
          )

          # Publish the Primary Type marker semantics explicitly for a correct Type legend.
          replace_once(
              'includes/services/class-public-locator-builder.php',
              "\t\tif ( in_array( $layout, array( 'split', 'map_only' ), true ) ) {\n\t\t\t$output['latitude']  = isset( $address['latitude'] ) ? $address['latitude'] : null;\n\t\t\t$output['longitude'] = isset( $address['longitude'] ) ? $address['longitude'] : null;\n\t\t\t$output['marker']    = $this->resolve_marker( $data );\n\t\t}\n",
              "\t\tif ( in_array( $layout, array( 'split', 'map_only' ), true ) ) {\n\t\t\t$output['latitude']  = isset( $address['latitude'] ) ? $address['latitude'] : null;\n\t\t\t$output['longitude'] = isset( $address['longitude'] ) ? $address['longitude'] : null;\n\t\t\t$output['marker']    = $this->resolve_marker( $data );\n\t\t\t$primary_type_id     = isset( $data['primary_type_id'] ) ? absint( $data['primary_type_id'] ) : 0;\n\t\t\tif ( $primary_type_id ) {\n\t\t\t\t$primary_type = $this->primary_type_data( $primary_type_id );\n\t\t\t\tif ( $primary_type ) {\n\t\t\t\t\t$output['primary_type'] = $primary_type;\n\t\t\t\t}\n\t\t\t}\n\t\t}\n"
          )
          replace_once(
              'includes/services/class-public-locator-builder.php',
              "\t/** Resolve marker inheritance. */\n\tprivate function resolve_marker( $data ) {\n",
              "\t/** Return public-safe Primary Type marker semantics for the map legend. */\n\tprivate function primary_type_data( $id ) {\n\t\t$term = get_term( absint( $id ), Taxonomies::TYPE );\n\t\tif ( ! $term || is_wp_error( $term ) ) {\n\t\t\treturn array();\n\t\t}\n\t\treturn array(\n\t\t\t'id'     => (int) $term->term_id,\n\t\t\t'name'   => $term->name,\n\t\t\t'slug'   => $term->slug,\n\t\t\t'marker' => array(\n\t\t\t\t'icon'       => (string) get_term_meta( $term->term_id, '_velomalo_marker_icon', true ) ?: 'pin',\n\t\t\t\t'color'      => (string) get_term_meta( $term->term_id, '_velomalo_marker_color', true ) ?: '#2563eb',\n\t\t\t\t'icon_color' => (string) get_term_meta( $term->term_id, '_velomalo_marker_icon_color', true ) ?: '#ffffff',\n\t\t\t),\n\t\t);\n\t}\n\n\t/** Resolve marker inheritance. */\n\tprivate function resolve_marker( $data ) {\n"
          )

          # Appearance variables.
          replace_once(
              'src/frontend/polish-1-1.js',
              "\t\tif ( appearance.card_padding !== null && appearance.card_padding !== undefined && appearance.card_padding !== '' ) {\n\t\t\tconst cardPadding = Math.max( 0, Math.min( 48, Number( appearance.card_padding ) || 0 ) );\n\t\t\troot.style.setProperty( '--vml-card-padding', `${ cardPadding }px` );\n\t\t} else {\n\t\t\troot.style.removeProperty( '--vml-card-padding' );\n\t\t}\n\n",
              "\t\tif ( appearance.card_padding !== null && appearance.card_padding !== undefined && appearance.card_padding !== '' ) {\n\t\t\tconst cardPadding = Math.max( 0, Math.min( 48, Number( appearance.card_padding ) || 0 ) );\n\t\t\troot.style.setProperty( '--vml-card-padding', `${ cardPadding }px` );\n\t\t} else {\n\t\t\troot.style.removeProperty( '--vml-card-padding' );\n\t\t}\n\n\t\tconst sizeVars = { card_title_size: '--vml-card-title-size', card_text_size: '--vml-card-text-size', popup_title_size: '--vml-popup-title-size', popup_text_size: '--vml-popup-text-size' };\n\t\tObject.entries( sizeVars ).forEach( ( [ key, cssVar ] ) => {\n\t\t\tif ( appearance[ key ] !== null && appearance[ key ] !== undefined && appearance[ key ] !== '' ) root.style.setProperty( cssVar, `${ Math.max( 10, Math.min( 30, Number( appearance[ key ] ) || 10 ) ) }px` );\n\t\t\telse root.style.removeProperty( cssVar );\n\t\t} );\n\t\tconst weightVars = { card_title_weight: '--vml-card-title-weight', card_text_weight: '--vml-card-text-weight', popup_title_weight: '--vml-popup-title-weight', popup_text_weight: '--vml-popup-text-weight' };\n\t\tObject.entries( weightVars ).forEach( ( [ key, cssVar ] ) => {\n\t\t\tif ( appearance[ key ] !== null && appearance[ key ] !== undefined && appearance[ key ] !== '' ) root.style.setProperty( cssVar, String( Math.max( 300, Math.min( 800, Number( appearance[ key ] ) || 400 ) ) ) );\n\t\t\telse root.style.removeProperty( cssVar );\n\t\t} );\n\n"
          )

          # Use Primary Type consistently for the visible card label too.
          replace_once(
              'src/frontend/polish-1-1.js',
              "\t\t\tconst type = Array.isArray( location.types ) && location.types[ 0 ] ? location.types[ 0 ] : null;\n",
              "\t\t\tconst type = location.primary_type || ( Array.isArray( location.types ) && location.types[ 0 ] ? location.types[ 0 ] : null );\n"
          )

          old_legend = """\tfunction buildLegend( root, controller ) {\n\t\tconst pane = root.querySelector( '[data-vml-map-pane]' );\n\t\tif ( ! pane || pane.querySelector( '[data-vml-map-legend]' ) ) return;\n\t\tconst entries = new Map();\n\t\tcontroller.locations.forEach( ( location ) => {\n\t\t\tconst type = Array.isArray( location.types ) && location.types[ 0 ] ? location.types[ 0 ] : null;\n\t\t\tif ( ! type || ! type.name ) return;\n\t\t\tconst color = location.marker && location.marker.color ? location.marker.color : '#2563eb';\n\t\t\tconst key = String( type.id || type.slug || type.name );\n\t\t\tif ( ! entries.has( key ) ) entries.set( key, { name: type.name, color } );\n\t\t} );\n\t\tif ( entries.size < 2 || entries.size > 8 ) return;\n\n\t\tconst legend = document.createElement( 'div' );\n\t\tlegend.className = 'vml-map-legend';\n\t\tlegend.dataset.vmlMapLegend = 'true';\n\t\tlegend.setAttribute( 'aria-label', 'Map legend' );\n\t\tentries.forEach( ( entry ) => {\n\t\t\tconst item = document.createElement( 'span' );\n\t\t\titem.className = 'vml-map-legend__item';\n\t\t\tconst swatch = document.createElement( 'span' );\n\t\t\tswatch.className = 'vml-map-legend__swatch';\n\t\t\tswatch.style.backgroundColor = entry.color;\n\t\t\tswatch.setAttribute( 'aria-hidden', 'true' );\n\t\t\tconst label = document.createElement( 'span' );\n\t\t\tlabel.textContent = entry.name;\n\t\t\titem.appendChild( swatch );\n\t\t\titem.appendChild( label );\n\t\t\tlegend.appendChild( item );\n\t\t} );\n\t\tpane.appendChild( legend );\n\t}\n"""
          new_legend = """\tfunction buildLegend( root, controller ) {\n\t\tconst pane = root.querySelector( '[data-vml-map-pane]' );\n\t\tif ( ! pane || pane.querySelector( '[data-vml-map-legend]' ) ) return;\n\t\tconst entries = new Map();\n\t\tcontroller.locations.forEach( ( location ) => {\n\t\t\tconst type = location.primary_type || null;\n\t\t\tif ( ! type || ! type.name ) return;\n\t\t\tconst marker = type.marker || {};\n\t\t\tconst key = String( type.id || type.slug || type.name );\n\t\t\tif ( ! entries.has( key ) ) entries.set( key, { name: type.name, color: marker.color || '#2563eb', icon: marker.icon || 'pin', iconColor: marker.icon_color || '#ffffff' } );\n\t\t} );\n\n\t\tconst visualStyles = new Set( Array.from( entries.values() ).map( ( entry ) => `${ entry.color }|${ entry.icon }|${ entry.iconColor }` ) );\n\t\tif ( entries.size < 2 || entries.size > 8 || visualStyles.size < 2 ) return;\n\n\t\tconst glyphs = { pin: '•', office: 'O', store: 'S', building: 'B', 'shopping-bag': 'S', warehouse: 'W', service: 'S', tools: 'T', clinic: '+', education: 'E', restaurant: 'R', atm: '$', dealer: 'D', star: '★' };\n\t\tconst legend = document.createElement( 'div' );\n\t\tlegend.className = 'vml-map-legend';\n\t\tlegend.dataset.vmlMapLegend = 'true';\n\t\tlegend.setAttribute( 'aria-label', 'Map legend' );\n\t\tentries.forEach( ( entry ) => {\n\t\t\tconst item = document.createElement( 'span' );\n\t\t\titem.className = 'vml-map-legend__item';\n\t\t\tconst swatch = document.createElement( 'span' );\n\t\t\tswatch.className = 'vml-map-legend__swatch';\n\t\t\tswatch.style.backgroundColor = entry.color;\n\t\t\tswatch.style.color = entry.iconColor;\n\t\t\tswatch.textContent = glyphs[ entry.icon ] || '•';\n\t\t\tswatch.setAttribute( 'aria-hidden', 'true' );\n\t\t\tconst label = document.createElement( 'span' );\n\t\t\tlabel.textContent = entry.name;\n\t\t\titem.appendChild( swatch );\n\t\t\titem.appendChild( label );\n\t\t\tlegend.appendChild( item );\n\t\t} );\n\t\tpane.appendChild( legend );\n\t}\n"""
          replace_once('src/frontend/polish-1-1.js', old_legend, new_legend)

          # CSS variables for cards/popups and richer legend marker chips.
          replace_once('src/styles/frontend-1-1.scss', "\tfont-size: .98rem;\n\tfont-weight: 650;\n", "\tfont-size: var(--vml-card-title-size, .98rem);\n\tfont-weight: var(--vml-card-title-weight, 650);\n")
          replace_once('src/styles/frontend-1-1.scss', "\tfont-size: .84rem;\n\tline-height: 1.4;\n\tmargin-top: 5px;\n", "\tfont-size: var(--vml-card-text-size, .84rem);\n\tfont-weight: var(--vml-card-text-weight, 400);\n\tline-height: 1.4;\n\tmargin-top: 5px;\n")
          replace_once('src/styles/frontend-1-1.scss', ".vml-locator[data-vml11-enhanced=\"true\"] .vml-location-card__hours,\n.vml-locator[data-vml11-enhanced=\"true\"] .vml-location-card__extra { margin-top: 11px; padding-top: 10px; }\n", ".vml-locator[data-vml11-enhanced=\"true\"] .vml-location-card__details,\n.vml-locator[data-vml11-enhanced=\"true\"] .vml-location-card__hours,\n.vml-locator[data-vml11-enhanced=\"true\"] .vml-location-card__extra {\n\tfont-size: var(--vml-card-text-size, inherit);\n\tfont-weight: var(--vml-card-text-weight, inherit);\n}\n.vml-locator[data-vml11-enhanced=\"true\"] .vml-location-card__hours,\n.vml-locator[data-vml11-enhanced=\"true\"] .vml-location-card__extra { margin-top: 11px; padding-top: 10px; }\n")
          replace_once('src/styles/frontend-1-1.scss', "\tfont-size: .82rem;\n\tfont-weight: 700;\n", "\tfont-size: var(--vml-card-text-size, .82rem);\n\tfont-weight: 700;\n")
          replace_once('src/styles/frontend-1-1.scss', "/* Strong card-level keyboard focus for cards that control a map marker. */\n", ".vml-locator[data-vml11-enhanced=\"true\"] .vml-map-popup__title {\n\tfont-size: var(--vml-popup-title-size, .98rem);\n\tfont-weight: var(--vml-popup-title-weight, 700);\n}\n.vml-locator[data-vml11-enhanced=\"true\"] .vml-map-popup__address,\n.vml-locator[data-vml11-enhanced=\"true\"] .vml-map-popup__link,\n.vml-locator[data-vml11-enhanced=\"true\"] .vml-map-popup__button {\n\tfont-size: var(--vml-popup-text-size, .84rem);\n\tfont-weight: var(--vml-popup-text-weight, 400);\n}\n\n/* Strong card-level keyboard focus for cards that control a map marker. */\n")
          replace_once('src/styles/frontend-1-1.scss', "\theight: 9px;\n\twidth: 9px;\n", "\talign-items: center;\n\tdisplay: inline-flex;\n\tfont-size: 8px;\n\tfont-weight: 800;\n\theight: 16px;\n\tjustify-content: center;\n\tline-height: 1;\n\twidth: 16px;\n")

          # Per-Locator Builder controls.
          builder_old = """\t\t\t\t\t\th( 'div', { className: 'vml-field-grid two' },\n\t\t\t\t\t\t\th( ColorField, { label: __( 'Accent Colour', 'velox-map-locator' ), value: appearance.accent || '#2563eb', onChange: ( value ) => updateConfig( 'appearance.accent', value ) } ),\n\t\t\t\t\t\t\th( Field, { label: __( 'Card Padding', 'velox-map-locator' ), hint: __( '0–48 px. Leave blank to use the current theme default spacing.', 'velox-map-locator' ) }, h( 'input', { type: 'number', min: 0, max: 48, value: appearance.card_padding ?? '', placeholder: __( 'Theme default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.card_padding', event.target.value === '' ? null : Number( event.target.value ) ) } ) )\n\t\t\t\t\t\t)\n"""
          builder_new = """\t\t\t\t\t\th( 'div', { className: 'vml-field-grid two' },\n\t\t\t\t\t\t\th( ColorField, { label: __( 'Accent Colour', 'velox-map-locator' ), value: appearance.accent || '#2563eb', onChange: ( value ) => updateConfig( 'appearance.accent', value ) } ),\n\t\t\t\t\t\t\th( Field, { label: __( 'Card Padding', 'velox-map-locator' ), hint: __( '0–48 px. Leave blank to use the current theme default spacing.', 'velox-map-locator' ) }, h( 'input', { type: 'number', min: 0, max: 48, value: appearance.card_padding ?? '', placeholder: __( 'Theme default', 'velox-map-locator' ), onChange: ( event ) => updateConfig( 'appearance.card_padding', event.target.value === '' ? null : Number( event.target.value ) ) } ) )\n\t\t\t\t\t\t),\n\t\t\t\t\t\th( 'div', { className: 'vml-builder-subhead' }, h( 'strong', null, __( 'Card Typography', 'velox-map-locator' ) ), h( 'span', null, __( 'Leave blank to keep the current Velox defaults.', 'velox-map-locator' ) ) ),\n\t\t\t\t\t\th( 'div', { className: 'vml-field-grid two' },\n\t\t\t\t\t\t\th( Field, { label: __( 'Card Title Size', 'velox-map-locator' ), hint: '10–30 px' }, h( 'input', { type: 'number', min: 10, max: 30, value: appearance.card_title_size ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( e ) => updateConfig( 'appearance.card_title_size', e.target.value === '' ? null : Number( e.target.value ) ) } ) ),\n\t\t\t\t\t\t\th( Field, { label: __( 'Card Title Weight', 'velox-map-locator' ) }, h( 'input', { type: 'number', min: 300, max: 800, step: 50, value: appearance.card_title_weight ?? '', placeholder: __( 'Default', 'velox-map-locator' ), onChange: ( e ) => updateConfig( 'appearance.card_title_weight', e.target.value === '' ? null : Number( e.target.value ) ) } ) ),\n\t\t\t\t\t\t\th( Field, { label: __( 'Card Text Size', 'velox-map-locator' ), hint: '10–30 px' }, h( 'input', { type: 'number', min: 10, max: 30, value: appearance.card_text_size ?? '', placeholder: __( 'Default', 'velox-map-