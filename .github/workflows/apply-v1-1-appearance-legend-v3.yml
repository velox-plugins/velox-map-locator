      - name: Validate modified files
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/content/class-settings.php
          php -l includes/services/class-locator-validator.php
          php -l includes/services/class-public-locator-builder.php
          node --check src/frontend/polish-1-1.js
          node --check src/admin/index.js
          cmp src/frontend/polish-1-1.js build/frontend-1-1.js
          cmp src/styles/frontend-1-1.scss build/frontend-1-1.css
          tail -n +2 src/admin/index.js | cmp - build/admin.js

      - name: Commit plugin changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Amar Saleem'
          git config user.email 'amarsaleem.sync@gmail.com'
          git add includes/content/class-settings.php includes/services/class-locator-validator.php includes/services/class-public-locator-builder.php src/frontend/polish-1-1.js build/frontend-1-1.js src/styles/frontend-1-1.scss build/frontend-1-1.css src/admin/index.js build/admin.js
          git commit -m 'Add semantic Type legend and typography controls'
          git push origin HEAD:release/1.1.0
