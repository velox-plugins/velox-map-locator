name: Apply Fit All Icon Refinement

on:
  push:
    branches:
      - 'release/1.1.0'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.1.0
          fetch-depth: 0

      - name: Replace Fit All icon in source and build adapters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>'
          new = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v6M9 6l3 3 3-3M12 21v-6M9 18l3-3 3 3M3 12h6M6 9l3 3-3 3M21 12h-6M18 9l-3 3 3 3"/></svg>'
          files = [
              Path('src/frontend/map-leaflet.js'),
              Path('build/map-leaflet.js'),
              Path('src/frontend/map-google.js'),
              Path('build/map-google.js'),
          ]
          for path in files:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 old Fit All icon, found {count}')
              path.write_text(text.replace(old, new))
          PY

      - name: Static checks
        shell: bash
        run: |
          node --check src/frontend/map-leaflet.js
          node --check build/map-leaflet.js
          node --check src/frontend/map-google.js
          node --check build/map-google.js
          cmp src/frontend/map-leaflet.js build/map-leaflet.js
          cmp src/frontend/map-google.js build/map-google.js

      - name: Remove helper workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-fit-all-icon.yml
          git config user.name 'Amar Saleem'
          git config user.email 'amarsaleem.sync@gmail.com'
          git add -A
          git commit -m 'Refine Fit All icon'
          git push origin HEAD:release/1.1.0
