name: Apply 1.1 QA Feedback

on:
  push:
    branches:
      - release/1.1.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.1.0
          fetch-depth: 0

      - name: Apply reviewed feedback
        run: python .github/scripts/apply-v1-1-feedback.py

      - name: Static sanity checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php -l includes/content/class-settings.php
          php -l includes/services/class-locator-validator.php
          node --check src/admin/index.js
          node --check build/admin.js
          node --check src/frontend/map-leaflet.js
          node --check build/map-leaflet.js
          node --check src/frontend/map-google.js
          node --check build/map-google.js
          node --check src/frontend/polish-1-1.js
          node --check build/frontend-1-1.js

      - name: Commit feedback changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/apply-v1-1-feedback.py .github/workflows/apply-v1-1-feedback.yml
          git config user.name "Amar Saleem"
          git config user.email "amarsaleem.sync@gmail.com"
          git add -A
          git commit -m "Apply locator QA feedback"
          git push origin HEAD:release/1.1.0
